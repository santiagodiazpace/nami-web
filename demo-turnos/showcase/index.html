<style>
  :root{ --cyan:#00AFFF; --ink:#000; --bg:#F8F8F6; }
  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ width:100%; height:100%; background:var(--bg); overflow:hidden }

  /* Stage fijo 1920×1080 que escala al navegador */
  #stage{ position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:50% 50%; background:var(--bg); overflow:hidden;
    font-family:Inter, system-ui, sans-serif; color:var(--ink) }

  /* Fondo: blanco roto + grilla muy tenue en los bordes + glow cyan mínimo */
  .bg-grid{ position:absolute; inset:0;
    background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);
    background-size:80px 80px; background-position:0 50px;
    -webkit-mask-image:radial-gradient(ellipse 62% 64% at 50% 50%,transparent 62%,#000 100%);
            mask-image:radial-gradient(ellipse 62% 64% at 50% 50%,transparent 62%,#000 100%) }
  .bg-glow{ position:absolute; left:50%; top:52%; width:1900px; height:1000px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(0,175,255,.07),rgba(0,175,255,0)) }

  /* Chrome superior */
  .chrome{ position:absolute; top:66px; display:flex; align-items:center; gap:14px; opacity:0 }
  #chrome-l{ left:240px }
  #chrome-r{ right:240px; gap:12px }
  .wm svg{ height:19px; width:auto; display:block; fill:#000 }
  .sep{ width:1px; height:16px; background:rgba(0,0,0,.18) }
  .lbl{ font:500 14px/1 Outfit, sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#707070 }
  .lbl b{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cyan); margin-right:9px; vertical-align:2px }
  #scn{ display:flex; align-items:baseline; gap:12px; transition:opacity .45s ease, transform .45s ease }
  #scn.swap{ opacity:0; transform:translateY(4px); transition:none }
  #scn .n{ font:600 14px/1 Outfit, sans-serif; letter-spacing:.08em; color:#000; font-variant-numeric:tabular-nums }
  #scn .o{ font:500 14px/1 Outfit, sans-serif; letter-spacing:.08em; color:#A0A0A0 }
  #scn .nm{ font:500 14px/1 Outfit, sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#707070; margin-left:6px }

  /* Marco del producto: ventana muy sutil */
  #frame{ position:absolute; left:240px; top:128px; width:1440px; height:846px; border-radius:16px;
    background:#fff; overflow:hidden; opacity:0; will-change:transform,opacity,filter;
    box-shadow:0 0 0 1px rgba(0,0,0,.065), 0 2px 4px rgba(0,0,0,.03), 0 44px 96px -34px rgba(0,30,60,.24) }
  .bar{ height:36px; border-bottom:1px solid rgba(0,0,0,.06); display:flex; align-items:center; gap:7px; padding-left:18px; background:#fff }
  .bar i{ width:10px; height:10px; border-radius:50%; background:#E7E7E7 }
  #view{ position:absolute; left:0; top:36px; width:1440px; height:810px; overflow:hidden; background:#fff }
  .layer{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform,opacity; visibility:hidden }
  .layer img{ display:block; width:100%; height:100%; user-select:none }
  .patch{ position:absolute; background-repeat:no-repeat }

  /* Overlays de foco (en coordenadas del frame) */
  #ov{ position:absolute; inset:0; pointer-events:none; overflow:hidden }
  .hl{ position:absolute; left:0; top:0; border-radius:10px; opacity:0; transform-origin:0 0; will-change:transform,opacity }
  .hl.focus{ border:2px solid var(--cyan); box-shadow:0 0 0 5px rgba(0,175,255,.14) }
  .hl.soft{ border:1.5px solid rgba(0,175,255,.55); background:rgba(0,175,255,.045) }
  .hl.muted{ border:1.5px dashed rgba(0,0,0,.32) }
  .hl.gap{ border:2px dashed var(--cyan); background:rgba(0,175,255,.05) }
  .hl.dim.focus{ box-shadow:0 0 0 5px rgba(0,175,255,.14), 0 0 0 4000px rgba(10,14,18,.10) }
  .hl.dim.gap{ box-shadow:0 0 0 4000px rgba(10,14,18,.10) }
  .hl .chk{ position:absolute; right:-14px; top:-14px; width:30px; height:30px; border-radius:50%;
    background:var(--cyan); display:grid; place-items:center; transform:scale(0); opacity:0;
    box-shadow:0 6px 16px -4px rgba(0,175,255,.55) }
  .hl .chk svg{ width:15px; height:15px }

  /* Cursor */
  #cursor{ position:absolute; left:0; top:0; width:26px; height:26px; opacity:0; transform-origin:3px 2px; will-change:transform,opacity;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.22)) }
  #ripple{ position:absolute; left:0; top:0; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%;
    border:2px solid rgba(0,175,255,.5); background:rgba(0,175,255,.12); opacity:0 }

  /* Captions */
  .cap{ position:absolute; opacity:0; will-change:transform,opacity }
  .cap.bl{ left:168px; bottom:118px }
  .cap.br{ right:168px; bottom:118px }
  .cap .card{ background:#000; color:#fff; border-radius:16px; padding:26px 34px 28px;
    box-shadow:0 30px 64px -26px rgba(0,0,0,.45) }
  .cap .ln{ width:28px; height:3px; border-radius:2px; background:var(--cyan); margin-bottom:16px }
  .cap .t{ font:600 40px/1.1 Sora, sans-serif; letter-spacing:-.025em; white-space:nowrap }
  .cap .t em{ font-style:normal; color:var(--cyan) }
  .cap .s{ font:400 20px/1.4 Inter, sans-serif; color:rgba(255,255,255,.62); margin-top:10px; white-space:nowrap }
  .cap.kicker .card{ background:#fff; color:#000; border-radius:999px; padding:15px 24px 15px 20px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 18px 40px -20px rgba(0,0,0,.28) }
  .cap.kicker .dot{ width:8px; height:8px; border-radius:50%; background:var(--cyan) }
  .cap.kicker .t{ font:500 21px/1 Outfit, sans-serif; letter-spacing:.01em }

  /* Progreso */
  #prog{ position:absolute; left:240px; right:240px; bottom:50px; height:2px; background:rgba(0,0,0,.07); border-radius:2px; opacity:0 }
  #prog b{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--cyan); border-radius:2px }
  #prog i{ position:absolute; top:-2px; width:2px; height:6px; margin-left:-1px; border-radius:1px; background:rgba(0,0,0,.14) }

  /* Cierre */
  #end{ position:absolute; inset:0; display:grid; place-items:center; opacity:0; pointer-events:none }
  #end .in{ display:flex; flex-direction:column; align-items:center }
  #end .wm svg{ height:78px }
  #end .ln{ width:56px; height:3px; border-radius:2px; background:var(--cyan); margin:38px 0 26px }
  #end .tag{ font:500 22px/1 Outfit, sans-serif; letter-spacing:.04em; color:#5E5E5E }
</style>
</head>

/* Capturas. Coordenadas en px CSS de cada captura.
   ui  = factor para que la UI se vea al mismo tamaño en todas (las capturas tienen distinto zoom).

  inicio:         { src:'assets/01-inicio.png',         ui:1.36,  dpr:1 },

   shots       capturas en pantalla. cam = [t, x, y, zoom, 'free'?]  (x,y = punto de la captura que va al centro).
               cont:true → continúa la toma anterior sin corte. fade = crossfade de entrada.
   highlights  rect [x,y,w,h] sobre la captura, t [desde, hasta]. style: focus | soft | muted | gap. dim oscurece el resto.

/* ════════════════════════════════════════════════════════════════
   MOTOR — render(t) es una función pura del tiempo: pausa, saltos y grabación son exactos.
   ════════════════════════════════════════════════════════════════ */
const ease = {
  io:  u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2,
  out: u => 1 - Math.pow(1 - u, 3),
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const c01 = v => clamp(v, 0, 1);
const lerp = (a, b, u) => a + (b - a) * u;
function ramp(t, t0, t1, fin = .35, fout = .35) {
  if (t < t0 || t > t1) return 0;
  return Math.min(ease.out(c01((t - t0) / fin)), ease.io(c01((t1 - t) / fout)));
}

const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), view = $('view'), ov = $('ov');
const cursorEl = $('cursor'), rippleEl = $('ripple'), endEl = $('end'), progEl = $('prog'), scnEl = $('scn');

const SHOTS = [], HLS = [], CAPS = [], CURSORS = [];
let TOTAL = 0, OUTRO = Infinity;

function kf(img, t, x, y, z, free) {
  const I = IMAGES[img], s = z * I.ui;
  let ox = FW / 2 - x * s, oy = FH / 2 - y * s;
  if (!free) {
    const dw = I.w * s, dh = I.h * s;
    ox = dw >= FW ? clamp(ox, FW - dw, 0) : (FW - dw) / 2;
    oy = dh >= FH ? clamp(oy, FH - dh, 0) : (FH - dh) / 2;
  }
  return { t, ox, oy, s };
}

function compile() {
  let T = 0;
  scenes.forEach(sc => {
    sc.start = T;
    sc.shots.forEach(sh => {
      const g = { img: sh.img, start: T + (sh.at || 0), fade: sh.cont ? 0 : (sh.fade ?? 0.7), kfs: [] };
      if (sh.cont) { const p = SHOTS[SHOTS.length - 1]; g.kfs.push({ ...p.kfs[p.kfs.length - 1], t: g.start }); }
      sh.cam.forEach(k => g.kfs.push(kf(sh.img, T + k[0], k[1], k[2], k[3], k[4] === 'free')));
      SHOTS.push(g);
    });
    (sc.highlights || []).forEach(h => HLS.push({ ...h, t0: T + h.t[0], t1: T + h.t[1], chkAt: h.check != null ? T + h.check : null }));
    (sc.captions || []).forEach(c => CAPS.push({ ...c, t0: T + c.t[0], t1: T + c.t[1] }));
    if (sc.cursor) CURSORS.push({
      img: sc.cursor.img,
      path: sc.cursor.path.map(p => [T + p[0], p[1], p[2]]),
      clicks: sc.cursor.clicks.map(c => T + c),
    });
    if (sc.outro != null) OUTRO = T + sc.outro;
    T += sc.dur;
  });
  TOTAL = T;
  const at = ref => scenes.find(s => s.id === ref[0]).start + ref[1];
  patches.forEach(p => { p.rt = p.reveal ? at(p.reveal) : Infinity; p.fd = p.fade ?? 0.5; p.els = []; });
}

function build() {
  SHOTS.forEach(sh => {
    const I = IMAGES[sh.img];
    const el = document.createElement('div');
    el.className = 'layer';
    el.style.width = I.w + 'px'; el.style.height = I.h + 'px';
    const im = document.createElement('img'); im.src = I.src; im.alt = ''; el.appendChild(im);
    patches.filter(p => p.on === sh.img).forEach(p => {
      const d = document.createElement('div'); d.className = 'patch';
      const [x, y, w, h] = p.rect;
      Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      if (p.color) d.style.background = p.color;
      else {
        const F = IMAGES[p.from], [sx, sy, sw, sh2] = p.src, kx = w / sw, ky = h / sh2;
        d.style.backgroundImage = `url(${F.src})`;
        d.style.backgroundSize = `${F.w * kx}px ${F.h * ky}px`;
        d.style.backgroundPosition = `${-sx * kx}px ${-sy * ky}px`;
      }
      el.appendChild(d); p.els.push(d);
    });
    view.insertBefore(el, ov);
    sh.el = el;
  });
  HLS.forEach(h => {
    const d = document.createElement('div');
    d.className = 'hl ' + (h.style || 'focus') + (h.dim ? ' dim' : '');
    if (h.check != null) {
      d.innerHTML = '<span class="chk"><svg viewBox="0 0 16 16"><path d="M3.2 8.4l3 3 6.6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
      h.chk = d.firstChild;
    }
    ov.insertBefore(d, rippleEl); h.el = d;
  });
  const caps = $('caps');
  CAPS.forEach(c => {
    const d = document.createElement('div');
    d.className = `cap ${c.pos || 'bl'} ${c.style || ''}`;
    d.innerHTML = c.style === 'kicker'
      ? `<div class="card"><span class="dot"></span><span class="t">${c.title}</span></div>`
      : `<div class="card"><div class="ln"></div><div class="t">${c.title}</div>${c.sub ? `<div class="s">${c.sub}</div>` : ''}</div>`;
    caps.appendChild(d); c.el = d;
  });
  scenes.forEach((s, i) => {
    if (!i) return;
    const tk = document.createElement('i'); tk.style.left = (s.start / TOTAL * 100) + '%'; progEl.appendChild(tk);
  });
}

function camOf(sh, t) {
  const k = sh.kfs;
  if (t <= k[0].t) return k[0];
  for (let i = 0; i < k.length - 1; i++) {
    if (t < k[i + 1].t) {
      const u = ease.io(c01((t - k[i].t) / (k[i + 1].t - k[i].t)));
      return { ox: lerp(k[i].ox, k[i + 1].ox, u), oy: lerp(k[i].oy, k[i + 1].oy, u), s: lerp(k[i].s, k[i + 1].s, u) };
    }
  }
  return k[k.length - 1];
}
function alphaOf(i, t) {
  const s = SHOTS[i], n = SHOTS[i + 1];
  if (t < s.start) return 0;
  if (n && t >= n.start + n.fade) return 0;
  return s.fade > 0 ? ease.io(c01((t - s.start) / s.fade)) : 1;
}
function shotFor(img, t) {
  let idx = -1;
  SHOTS.forEach((s, i) => { if (s.img === img && (s.start <= t || idx < 0)) idx = i; });
  return idx;
}
const toFrame = (c, x, y) => [c.ox + x * c.s, c.oy + y * c.s];

let curScene = -1;
function render(t) {
  // Capturas + cámara
  const A = SHOTS.map((_, i) => alphaOf(i, t)), V = new Array(SHOTS.length);
  let cover = 1;
  for (let i = SHOTS.length - 1; i >= 0; i--) { V[i] = A[i] * cover; cover *= 1 - A[i]; }
  const cams = SHOTS.map((sh, i) => {
    const c = camOf(sh, t);
    if (A[i] > 0.001) {
      sh.el.style.visibility = 'visible';
      sh.el.style.opacity = A[i];
      sh.el.style.transform = `translate3d(${c.ox}px,${c.oy}px,0) scale(${c.s})`;
    } else sh.el.style.visibility = 'hidden';
    return c;
  });
  const visOf = img => { let v = 0; SHOTS.forEach((s, i) => { if (s.img === img) v += V[i]; }); return v; };

  // Parches (cambios de estado in situ)
  patches.forEach(p => {
    const o = 1 - ease.io(c01((t - p.rt) / p.fd));
    p.els.forEach(e => e.style.opacity = o);
  });

  // Highlights
  HLS.forEach(h => {
    let a = ramp(t, h.t0, h.t1);
    if (a > 0) a *= visOf(h.img);
    if (a <= 0.001) { h.el.style.opacity = 0; return; }
    const c = cams[shotFor(h.img, t)], pad = h.pad ?? 6;
    const [x, y] = toFrame(c, h.rect[0], h.rect[1]);
    const w = h.rect[2] * c.s + pad * 2, hh = h.rect[3] * c.s + pad * 2;
    const k = 1 + 0.035 * (1 - ease.out(c01((t - h.t0) / .45)));
    h.el.style.opacity = a;
    h.el.style.width = w + 'px';
    h.el.style.height = hh + 'px';
    h.el.style.transform = `translate3d(${x - pad - (k - 1) * w / 2}px,${y - pad - (k - 1) * hh / 2}px,0) scale(${k})`;
    if (h.pulse) {
      const p = (Math.sin((t - h.t0) * 3.2 - Math.PI / 2) + 1) / 2;
      h.el.style.boxShadow = `0 0 0 ${5 + p * 5}px rgba(0,175,255,${.2 - p * .1}), 0 14px 34px -12px rgba(0,175,255,.5)`;
    }
    if (h.chk) {
      const u = c01((t - h.chkAt) / .45);
      h.chk.style.transform = `scale(${t < h.chkAt ? 0 : 0.6 + 0.4 * ease.out(u)})`;
      h.chk.style.opacity = t < h.chkAt ? 0 : ease.out(u);
    }
  });

  // Cursor + ripple
  let cOp = 0, press = 1;
  rippleEl.style.opacity = 0;
  CURSORS.forEach(cu => {
    const t0 = cu.path[0][0], tEnd = cu.clicks[cu.clicks.length - 1] + .55;
    if (t < t0 - .01 || t > tEnd + .4) return;
    cOp = Math.min(ease.out(c01((t - t0) / .3)), 1 - ease.io(c01((t - tEnd) / .4)));
    const c = cams[shotFor(cu.img, t)], P = cu.path;
    let x, y;
    if (t <= P[0][0]) [x, y] = toFrame(c, P[0][1], P[0][2]);
    else if (t >= P[P.length - 1][0]) [x, y] = toFrame(c, P[P.length - 1][1], P[P.length - 1][2]);
    else for (let i = 0; i < P.length - 1; i++) if (t < P[i + 1][0]) {
      const u = ease.io((t - P[i][0]) / (P[i + 1][0] - P[i][0]));
      const [ax, ay] = toFrame(c, P[i][1], P[i][2]), [bx, by] = toFrame(c, P[i + 1][1], P[i + 1][2]);
      const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1, arc = Math.sin(Math.PI * u) * Math.min(36, d * .12);
      x = lerp(ax, bx, u) + (-dy / d) * arc; y = lerp(ay, by, u) + (dx / d) * arc;
      break;
    }
    cu.clicks.forEach(ck => {
      const d = t - ck;
      if (d >= 0 && d < .24) press = 1 - .13 * Math.sin(Math.PI * d / .24);
      if (d >= 0 && d < .7) {
        const u = d / .7;
        rippleEl.style.opacity = .9 * (1 - u);
        rippleEl.style.transform = `translate3d(${x}px,${y}px,0) scale(${.25 + .95 * ease.out(u)})`;
      }
    });
    cursorEl.style.transform = `translate3d(${x - 3}px,${y - 2}px,0) scale(${press})`;
  });
  cursorEl.style.opacity = cOp;

  // Captions
  CAPS.forEach(c => {
    const a = ramp(t, c.t0, c.t1, .6, .45);
    const u = ease.out(c01((t - c.t0) / .7));
    c.el.style.opacity = a;
    c.el.style.transform = `translate3d(0,${(1 - u) * 16}px,0)`;
  });

  // Entrada / cierre
  const inA = ease.out(c01(t / .9)), outU = ease.io(c01((t - OUTRO) / .9));
  frame.style.opacity = inA * (1 - outU);
  frame.style.transform = `translate3d(0,${(1 - inA) * 18 - outU * 6}px,0) scale(${(0.985 + .015 * inA) * (1 - .015 * outU)})`;
  frame.style.filter = outU > 0 ? `blur(${outU * 6}px)` : 'none';
  const chA = ease.out(c01((t - .2) / .8)) * (1 - outU);
  $('chrome-l').style.opacity = chA; $('chrome-r').style.opacity = chA;
  const endU = ease.out(c01((t - OUTRO - .35) / .9));
  endEl.style.opacity = endU;
  endEl.style.transform = `translate3d(0,${(1 - endU) * 12}px,0)`;

  // Progreso + indicador de escena
  progEl.style.opacity = ease.out(c01(t / .9)) * .9 * (1 - outU * .6);
  progEl.firstChild.style.width = (c01(t / TOTAL) * 100) + '%';
  const si = sceneIndexAt(t);
  if (si !== curScene) {
    curScene = si;
    scnEl.classList.add('swap');
    scnEl.querySelector('.n').textContent = String(si + 1).padStart(2, '0');
    scnEl.querySelector('.o').textContent = '/ ' + String(scenes.length).padStart(2, '0');
    scnEl.querySelector('.nm').textContent = scenes[si].name;
    requestAnimationFrame(() => requestAnimationFrame(() => scnEl.classList.remove('swap')));
  }
}

/* ════════════════════════════════════════════════════════════════
   REPRODUCCIÓN + CONTROLES  (Space pausa · R reinicia · ← → escena)
   ════════════════════════════════════════════════════════════════ */
let t = -START_DELAY, playing = true, last = null;

function sceneIndexAt(x) { let si = 0; scenes.forEach((s, i) => { if (x >= s.start) si = i; }); return si; }
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
function tick(now) {
  if (last == null) last = now;
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) {
    t += dt;
    if (t >= TOTAL) {
      if (!LOOP && !EMBED) { t = TOTAL; playing = false; }
      else if (t >= TOTAL + LOOP_GAP) t = -START_DELAY / 2;
    }
  }
  render(clamp(t, -1, TOTAL));
  requestAnimationFrame(tick);
}
let started = !EMBED;
function setPlaying(p, user) {
  if (p && !started) { started = true; t = -START_DELAY; }
  playing = p;
  if (EMBED) parent.postMessage({ nami: 'state', playing, user: !!user }, '*');
}
if (EMBED) {
  addEventListener('message', e => {
    if (e.source !== parent || !e.data) return;
    if (e.data.nami === 'play') setPlaying(true);
    if (e.data.nami === 'pause') setPlaying(false);
  });
  stage.addEventListener('click', () => setPlaying(!playing, true));
  stage.style.cursor = 'pointer';
}
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing && t >= TOTAL) t = -START_DELAY; setPlaying(!playing, true); }
  else if (e.key === 'r' || e.key === 'R') { t = -START_DELAY; playing = true; }
  else if (e.key === 'ArrowRight') { const i = sceneIndexAt(Math.max(t, 0)); t = i + 1 < scenes.length ? scenes[i + 1].start : TOTAL; }
  else if (e.key === 'ArrowLeft') { const i = sceneIndexAt(Math.max(t, 0)); t = (t - scenes[i].start > .8 || i === 0) ? scenes[i].start : scenes[i - 1].start; }
});
addEventListener('resize', fit);

// Revisión puntual:  ?scene=4   ?t=18.5   ?paused
window.seek = x => { t = x; render(clamp(t, -1, TOTAL)); };

(async function init() {
  fit();
  await Promise.all(Object.values(IMAGES).map(I => new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => { I.w = im.naturalWidth / I.dpr; I.h = im.naturalHeight / I.dpr; ok(); };
    im.onerror = () => ko(new Error('No se pudo cargar ' + I.src));
    im.src = I.src;
  })));
  try { await document.fonts.ready; } catch (_) {}
  compile(); build();
  const q = new URLSearchParams(location.search);
  if (q.has('scene')) t = scenes[clamp(+q.get('scene') - 1, 0, scenes.length - 1)].start;
  if (q.has('t')) t = +q.get('t');
  if (q.has('paused')) playing = false;
  if (EMBED) { playing = false; t = POSTER_T; parent.postMessage({ nami: 'ready' }, '*'); }
  render(clamp(t, -1, TOTAL));
  requestAnimationFrame(tick);
})();
</script>
