.cx-bar{width:150px;height:1px;background:rgba(255,255,255,.16);overflow:hidden}

.cx-nav{pointer-events:auto;display:flex;align-items:center;gap:18px;max-width:min(100%,520px);padding:6px 8px 6px 16px;border-radius:999px;background:rgba(48,48,50,.55);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.cx-logo{display:flex;align-items:center;gap:8px;text-decoration:none;padding-right:8px;min-width:0}
.cx-logo svg{display:block}
.cx-logo span{font-size:18px;font-weight:500;letter-spacing:-.03em}
.cx-seg{display:flex;align-items:center;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;flex-shrink:0}
.cx-seg button{border:0;background:transparent;color:rgba(255,255,255,.55);font-size:13px;font-weight:500;padding:8px 16px;min-height:44px;border-radius:999px;cursor:pointer;transition:background .25s ease,color .25s ease;-webkit-tap-highlight-color:transparent}

.cx-stage{position:fixed;top:0;left:0;width:100%;height:var(--vh);z-index:1;overflow:hidden}
.cx-layer{position:absolute;inset:0;opacity:0;will-change:opacity}
.cx-hero{background:#0a0a0b;isolation:isolate}
.cx-apps{background:#0d0d0e}
.cx-track{position:relative;z-index:0}
.cx-hero-copy{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;padding:calc(88px + env(safe-area-inset-top,0px)) var(--pad) 0 max(var(--pad),env(safe-area-inset-left,0px));pointer-events:none}
.cx-hero-copy h1{font-weight:500;letter-spacing:-.045em;line-height:1.18;color:rgba(255,255,255,.92);font-size:clamp(24px,3.6vw,52px);max-width:min(18ch,100%)}
.cx-hero-media{position:absolute;inset:0;pointer-events:none}
.cx-hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;will-change:transform;transform:translateZ(0)}
.cx-scene{position:absolute;inset:0;opacity:0;transition:opacity .55s ease}
.cx-scene.is-on{opacity:1}
.cx-scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cx-scene .cx-bg{filter:blur(28px) saturate(1.08) brightness(.55);transform:scale(1.14)}

.cx-opt.is-on{color:#fff}

    function attach(src) {
      if (attached) return; attached = true;
      video.addEventListener('loadedmetadata', () => {
        dur = isFinite(video.duration) && video.duration > 0 ? video.duration : 6;
        video.pause();
        heroTarget = clamp((scrollY || 0) / heroLen, 0, 1); seekAt = heroTarget * dur;
        try { video.currentTime = seekAt; } catch (e) {}
      });
      ['loadeddata', 'canplaythrough', 'error'].forEach((ev) => video.addEventListener(ev, start));
      video.src = src; video.load();
      setTimeout(start, 12000);
    }
    function preload() {
      const ctrl = ('AbortController' in window) ? new AbortController() : null;
      const bail = setTimeout(() => { if (attached) return; if (ctrl) ctrl.abort(); setBootProgress(1); attach(VIDEO_URL); }, 15000);
      fetch(VIDEO_URL, ctrl ? { signal: ctrl.signal } : undefined).then((res) => {
        if (!res.ok || !res.body) throw new Error('bad response');
        const total = Number(res.headers.get('content-length')) || 0;
        const reader = res.body.getReader();
        const chunks = []; let got = 0;
        function pump() {
          return reader.read().then(({ done, value }) => {
            if (done) return new Blob(chunks, { type: 'video/mp4' });
            chunks.push(value); got += value.length;
            setBootProgress(total ? got / total : Math.min(got / 6.5e6, 0.95));
            return pump();
          });
        }
        return pump();
      }).then((blob) => { clearTimeout(bail); setBootProgress(1); attach(URL.createObjectURL(blob)); })
        .catch(() => { clearTimeout(bail); setBootProgress(1); attach(VIDEO_URL); });
    }
    function unlock() {
      const p = video.play();
      if (p && p.then) p.then(() => video.pause()).catch(() => {}); else video.pause();
    }
    ["touchstart", "pointerdown", "wheel", "keydown"].forEach((ev) => addEventListener(ev, unlock, { once: true, passive: true }));

    function renderCard(i) {
      const item = APPS[i];
      let html = '<h2>' + item.title + '</h2>';
      item.specs.forEach((s) => {
        html += '<div class="cx-spec"><b></b><div><small>' + s.k + '</small>' + (s.tag ? '<span class="cx-tag">' + s.tag + '</span>' : '<span>' + s.v + '</span>') + '</div></div>';
      });
      if (item.colors) {
        html += '<div class="cx-spec"><b></b><div><small>Supplied in</small><div class="cx-swatches">' + item.colors.map((c) => '<i style="background:' + c + '"></i>').join('') + '</div></div></div>';
      }
      card.innerHTML = html;
      more.textContent = item.more;
    }

    function setIndex(i, fromScroll) {
      if (!Number.isFinite(i)) return;
      const next = clamp(i, 0, STEPS);
      if (next !== index) {
        index = next;
        scenes.forEach((s) => s.classList.toggle('is-on', Number(s.dataset.i) === index));
        opts.forEach((o, oi) => o.classList.toggle('is-on', oi === index));
        renderCard(index);
        if (innerWidth <= MOBILE_BP) {
          const a = opts[index].getBoundingClientRect(); const m = menu.getBoundingClientRect();
          menu.scrollBy({ left: (a.left + a.width / 2) - (m.left + m.width / 2), behavior: 'smooth' });
        }
      }
      if (!fromScroll) scrollTo({ top: appsStart + (index / STEPS) * appsLen, behavior: 'smooth' });
    }

    let lastFade = -1, lastOnApps = null;
    function paintUI() {
      const y = scrollY || pageYOffset;
      const fadeP = range(y, heroLen, appsStart);
      if (fadeP !== lastFade) {
        lastFade = fadeP;
        heroLayer.style.opacity = 1 - fadeP; appsLayer.style.opacity = fadeP;
        heroLayer.style.visibility = fadeP === 1 ? 'hidden' : 'visible';
        appsLayer.style.visibility = fadeP === 0 ? 'hidden' : 'visible';
      }
      setIndex(Math.round(range(y, appsStart, appsStart + appsLen) * STEPS), true);
      const onApps = fadeP > 0.5;
      if (onApps !== lastOnApps) {
        lastOnApps = onApps;
        btnFull.classList.toggle('is-on', !onApps);
        btnOverview.classList.toggle('is-on', onApps);
      }
    }

    function frame() {
      if (ready && dur) {
        const gap = heroTarget * dur - seekAt;
        if (Math.abs(gap) > 0.0008) {
          seekAt += gap * 0.115;
          if (video.readyState >= 2 && !video.seeking) { try { video.currentTime = seekAt; } catch (e) {} }
        }
      }
      paintUI();
      raf = requestAnimationFrame(frame);
    }

    addEventListener('scroll', () => { heroTarget = clamp((scrollY || 0) / heroLen, 0, 1); }, { passive: true });
    addEventListener('resize', () => { layout(false); heroTarget = clamp((scrollY || 0) / heroLen, 0, 1); });
    addEventListener('orientationchange', () => { layout(true); heroTarget = clamp((scrollY || 0) / heroLen, 0, 1); });

    function inAppsZone() { const y = scrollY || pageYOffset; return y >= appsStart - 1 && y <= appsStart + appsLen + 1; }

    addEventListener('wheel', (e) => {
      if (!inAppsZone() || wheelLock) return;
      const down = e.deltaY > 0;
      if ((down && index >= STEPS) || (!down && index <= 0)) return;
      e.preventDefault(); wheelLock = true; setIndex(index + (down ? 1 : -1), false);
      setTimeout(() => { wheelLock = false; }, 620);
    }, { passive: false });

    let touchStartY = 0, touchStartX = 0;
    addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; touchStartX = e.touches[0].clientX; }, { passive: true });
    addEventListener('touchend', (e) => {
      const t = e.changedTouches[0]; const dy = touchStartY - t.clientY; const dx = Math.abs(touchStartX - t.clientX);
      if (Math.abs(dy) < 40 || dx > 60 || !inAppsZone()) return;
      const down = dy > 0;
      if ((down && index >= STEPS) || (!down && index <= 0)) return;
      setIndex(index + (down ? 1 : -1), false);
    }, { passive: true });

    btnFull.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
    btnOverview.addEventListener('click', () => scrollTo({ top: appsStart, behavior: 'smooth' }));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(frame);
    });

    video.pause();
    video.muted = true;
    layout(true);
    renderCard(0);
    paintUI();
    preload();
    raf = requestAnimationFrame(frame);
    // ref-callback fires before the host finishes sizing the mounted container,
    // so the first innerHeight read can be bogus (near 0) — self-correct shortly after.
    setTimeout(() => { layout(true); heroTarget = clamp((scrollY || 0) / heroLen, 0, 1); paintUI(); }, 250);
  }
}
</script>
</body>
</html>
